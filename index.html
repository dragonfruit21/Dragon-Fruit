<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Fruit Planner</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#1f4d2b;--muted:#5c7a63;--line:#d9e1ec;--pink:#1a3a8f;--pinkbg:#e3eafb;--green:#2e7d32;--greenbg:#e3f3e4;--amber:#b26a00;--amberbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--card:#19212c;--ink:#d7f2dc;--muted:#9fc0a7;--line:#2a3441;--pink:#7b9cff;--pinkbg:#1c2a4d;--green:#81c784;--greenbg:#1f3322;--amber:#ffb74d;--amberbg:#3a2c12}}
:root[data-theme="dark"]{--bg:#10151d;--card:#19212c;--ink:#d7f2dc;--muted:#9fc0a7;--line:#2a3441;--pink:#7b9cff;--pinkbg:#1c2a4d;--green:#81c784;--greenbg:#1f3322;--amber:#ffb74d;--amberbg:#3a2c12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;margin:8px 0 2px;color:var(--green)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:90px}
input[type=text],input[type=password]{width:170px}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--pink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 9px;font-size:.8rem}
button.ok{background:var(--green);color:#fff;padding:5px 9px;font-size:.8rem}
.plant h2{margin:0;font-size:1.15rem;color:var(--green)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tot{color:var(--muted);font-size:.85rem}
.batch{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-size:.8rem;border-radius:99px;padding:2px 10px;background:var(--pinkbg);color:var(--pink);white-space:nowrap}
.pill.ready{background:var(--greenbg);color:var(--green)}
.pill.late{background:var(--amberbg);color:var(--amber)}
.bar{height:6px;border-radius:4px;background:var(--line);margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink)}
.bar i.ready{background:var(--green)}
.meta{font-size:.8rem;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:6px}
.next{background:var(--pinkbg);border-color:transparent}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line)}.tab.on{background:var(--pink);color:#fff;border-color:var(--pink)}.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border:0}.trow b{color:var(--green)}.th{margin:0 0 4px;font-size:1.1rem;color:var(--green)}
.info{border-radius:50%;width:28px;height:28px;padding:0;font-weight:700;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.ov[hidden]{display:none}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.plant{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.plant input,.plant select{-webkit-user-select:text;user-select:text}.danger{background:#b3261e}
.plant.sel{outline:2px solid var(--pink);background:var(--pinkbg)}.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;flex:none}.chk.on{background:var(--pink);border-color:var(--pink)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.selbar[hidden]{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:2rem;line-height:1;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:30}.fab[hidden]{display:none}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pink);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}button:disabled{opacity:.6;cursor:default}
.empty{color:var(--muted);text-align:center;padding:24px}
.err{color:var(--amber);font-size:.85rem;margin-top:6px;min-height:1em}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<header class="hd"><div><h1>Dragon Fruit Planner</h1>
<p class="sub">Track each plant’s flowers and count down to harvest.</p></div></header>

<div class="card" id="acct"></div>
<div class="card" id="loading" hidden style="text-align:center;padding:36px"><div class="spin"></div><div>Loading your planner…</div></div>
<div class="tabs"><button class="tab on" data-a="tab" data-t="planner">Planner</button><button class="tab" data-a="tab" data-t="totals">Totals</button></div>
<div id="v-planner"><div class="card next" id="next"></div>

<div class="row" id="listbar" style="justify-content:space-between;align-items:center;margin:4px 2px 10px"><strong id="pcount">Plants</strong><button class="ghost" data-a="selStart">Select</button></div>

<div id="plants"></div></div>
<div id="v-totals" hidden><div class="card"><h2 class="th">Flowers by plant type</h2><div class="meta">Counts flowers still growing. Harvested batches are not included.</div><div id="totals"></div></div></div>
</main>
<div class="ov" id="modal" data-a="closeSet" hidden></div>
<div class="selbar" id="selbar" hidden></div>
<button class="fab" id="fab" data-a="openPlants" aria-label="Add plant" hidden>+</button>

<script>
(function(){
var KEY="dfp1", S={days:35,plants:[]}, TYPES=["Sugar Dragon","SourPatch Kids","White Vietnamese","Shayna","NOID"], infoOpen=false, bloomFor=null, plantFlow=null, delList=null, selMode=false, sel={}, editing=null, editingP=null, tab="planner", open={};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.plants)S=p}}catch(e){}
function save(skip){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(sess&&!skip){clearTimeout(timer);timer=setTimeout(push,800)}}
var SB="https://usmsyjftegnekeffhwna.supabase.co",KEYA="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzbXN5amZ0ZWduZWtlZmZod25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDA1NjUsImV4cCI6MjEwODM3NjU2NX0.ZRizDpZ97C4bhCsze42JHxVqkF05MEw2busLfWE9kDE";
var SK="dfp-sess",sess=null,lastAt="",timer=null,msg="",openAcct=false,authMode="signin",loading=false,busy=false;
try{sess=JSON.parse(localStorage.getItem(SK))}catch(e){}
if(sess&&!sess.user)sess=null;
lastAt=(sess&&sess.last)||"";loading=!!sess;
function setSess(s){sess=s;try{if(s)localStorage.setItem(SK,JSON.stringify(s));else localStorage.removeItem(SK)}catch(e){}}
function setLast(v){lastAt=v;if(sess){sess.last=v;setSess(sess)}}
function api(path,opt,useTok){
  opt=Object.assign({},opt);
  opt.headers=Object.assign({apikey:KEYA,"Content-Type":"application/json"},opt.headers||{});
  opt.headers.Authorization="Bearer "+(useTok&&sess?sess.access_token:KEYA);
  return fetch(SB+path,opt);
}
function toSess(j){return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email,name:(j.user.user_metadata||{}).username||""},last:lastAt}}
function refresh(){
  if(!sess)return Promise.reject(0);
  return api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:sess.refresh_token})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){setSess(toSess(j))});
}
function authed(path,opt){
  var go=function(){return api(path,opt,true)};
  var pre=(sess&&sess.expires_at-Math.floor(Date.now()/1000)<60)?refresh().catch(function(){}):Promise.resolve();
  return pre.then(go).then(function(r){if(r.status===401)return refresh().then(go);return r});
}
function status(t){msg=t;var er=$("aerr");if(sess||!er)renderAcct();else er.textContent=t}
function renderAcct(){
  renderTotals();var el=$("acct");
  if(sess){el.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><div class="meta">Signed in as <b>'+esc(sess.user.name||sess.user.email)+'</b> · '+esc(msg||"Ready")+'</div><button class="ghost" data-a="signout">Sign out</button></div>';return}
  var up=authMode==="signup";
  el.innerHTML='<div><strong>'+(up?'Create your account':'Sign in to sync across devices')+'</strong><div class="meta">Without signing in, your plants are saved on this device only.</div><div class="row" style="margin-top:8px">'
  +(up?'<label>Email<input type="text" id="aem" autocomplete="email"></label>':'')
  +'<label>Username<input type="text" id="aun" autocomplete="'+(up?'nickname':'username')+'"></label><label>Password<input type="password" id="apw" autocomplete="'+(up?'new-password':'current-password')+'"></label></div><div class="acts"><button data-a="'+(up?'signup':'signin')+'">'+(up?'Create account':'Sign in')+'</button><button class="ghost" data-a="mode" data-m="'+(up?'signin':'signup')+'">'+(up?'Back to sign in':'Create account')+'</button></div><div class="err" id="aerr">'+esc(msg)+'</div></div>';
}
function push(){
  if(!sess)return Promise.resolve();
  clearTimeout(timer);timer=null;
  var at=new Date().toISOString();status("Saving…");
  return authed("/rest/v1/planner?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:sess.user.id,data:S,updated_at:at})}).then(function(r){if(!r.ok)throw 0;setLast(at);status("Synced")}).catch(function(){status("Could not sync. Saved on this device.")});
}
function pull(first){
  if(!sess)return Promise.resolve();
  first=first||!lastAt;
  return authed("/rest/v1/planner?user_id=eq."+sess.user.id+"&select=data,updated_at").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
    var row=rows[0],cl=row&&row.data&&row.data.plants?row.data:null;
    if(cl&&cl.plants.length){
      if(first&&S.plants.length&&JSON.stringify(S.plants)!==JSON.stringify(cl.plants)){
        if(!confirm("Your cloud planner already has data.\n\nOK = use the cloud data on this device.\nCancel = replace the cloud data with this device’s data."))return push();
      }else if(!first&&Date.parse(row.updated_at)<=Date.parse(lastAt)){status("Synced");return}
      S=cl;if(!S.days)S.days=35;setLast(row.updated_at);save(true);render();status("Synced");
    }else if(S.plants.length){return push()}
    else{status("Synced")}
  }).catch(function(){status("Offline or sync problem. Saved on this device.")});
}
var LOADMS=8000;
function withLoad(fn){
  loading=true;renderAcct();
  var done=false,tm;
  var fin=function(){if(done)return;done=true;clearTimeout(tm);loading=false;render();renderAcct()};
  tm=setTimeout(function(){if(!done){msg="Taking too long. Showing what is saved on this device.";fin()}},LOADMS);
  return Promise.resolve().then(fn).then(fin,fin);
}
function doAuth(kind){
  if(busy)return;
  var un=$("aun").value.trim(),pw=$("apw").value,em=kind==="signup"?$("aem").value.trim():"";
  if(!/^[A-Za-z0-9_]{3,20}$/.test(un)){status("Username must be 3 to 20 letters, numbers or underscores.");return}
  if(pw.length<6){status("Password must be at least 6 characters.");return}
  if(kind==="signup"&&!/^\S+@\S+\.\S+$/.test(em)){status("Enter a valid email.");return}
  status("Working…");busy=true;
  var btns=document.querySelectorAll("#acct button");for(var i=0;i<btns.length;i++)btns[i].disabled=true;
  var FN="/functions/v1/username-auth";
  var fail=function(){status("Could not connect. Check your internet.")};
  var down=function(x){return x.status>=500||x.status===404||x.status===401};
  var post=function(path,body){return api(path,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j}},function(){return {ok:r.ok,status:r.status,j:{}}})})};
  var go;
  if(kind==="signup"){
    go=post(FN,{action:"available",username:un}).then(function(a){
      if(!a.ok){status(down(a)?"Sign-in service is not available. Try again later.":"Something went wrong.");return}
      if(!a.j.available){status("That username is taken. Try another.");return}
      return post("/auth/v1/signup",{email:em,password:pw,data:{username:un}}).then(function(x){
        if(!x.ok){status(x.j.msg||x.j.error_description||x.j.message||"Something went wrong.");return}
        if(!x.j.access_token){authMode="signin";msg="Account created. Check your email to confirm it, then sign in with your username.";renderAcct();return}
        lastAt="";setSess(toSess(x.j));msg="";return withLoad(function(){return pull(true)});
      });
    });
  }else{
    go=post(FN,{action:"login",username:un,password:pw}).then(function(x){
      if(!x.ok){status(down(x)?"Sign-in service is not available. Try again later.":(x.j.error==="email_not_confirmed"?"Please confirm your email first, then sign in.":"Incorrect username or password."));return}
      lastAt="";setSess(toSess(x.j));msg="";return withLoad(function(){return pull(true)});
    });
  }
  go.catch(fail).then(function(){busy=false;var b2=document.querySelectorAll("#acct button");for(var k=0;k<b2.length;k++)b2[k].disabled=false});
}
function signOut(){loading=false;clearTimeout(timer);timer=null;setSess(null);lastAt="";msg="";openAcct=false;renderAcct()}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function fmt(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function renderModal(){
  var m=$("modal"),bp=bloomFor?find(bloomFor):null;if(!bp)bloomFor=null;
  var dl=(delList||[]).map(find).filter(Boolean);if(!dl.length)delList=null;
  m.hidden=!(infoOpen||bloomFor||plantFlow||delList);
  if(delList){var fl=0,nbk=0;dl.forEach(function(x){nbk+=x.batches.length;x.batches.forEach(function(b){fl+=b.qty})});var ns=dl.slice().sort(function(a,b){return a.num-b.num}).map(function(x){return '#'+x.num}).join(', ');m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Delete plants"><strong style="font-size:1.1rem">Delete '+(dl.length===1?'Plant '+ns:dl.length+' plants')+'?</strong><div class="meta" style="margin:8px 0">'+(dl.length>1?esc(ns)+' · ':'')+fl+(fl===1?' flower':' flowers')+' in '+nbk+(nbk===1?' bloom':' blooms')+'. This can’t be undone.</div><div class="acts" style="margin-top:10px"><button class="danger" data-a="delConfirm">Delete</button><button class="ghost" data-a="closeSet">Cancel</button></div></div>';return}
  if(plantFlow){var pf=plantFlow,b2;
    if(pf.step===1){b2='<div class="row" style="margin-top:8px"><label>Plant type<select id="pt"><option value="">Select type</option>'+TYPES.map(function(t){return '<option'+(t===pf.type?' selected':'')+'>'+esc(t)+'</option>'}).join("")+'</select></label><label>How many plants?<input type="number" id="pq" min="1" max="50" value="'+pf.qty+'" inputmode="numeric"></label></div><div class="err" id="pferr"></div><div class="acts" style="margin-top:10px"><button data-a="plantNext">Next</button><button class="ghost" data-a="closeSet">Cancel</button></div>'}
    else{b2='<div class="meta" style="margin:6px 0 4px">'+pf.qty+' × '+esc(pf.type)+'. Give each plant its number.</div>'+pf.nums.map(function(v,k){return '<div class="trow"><label for="pn'+k+'" style="flex-direction:row;color:var(--ink);font-size:1rem">Plant '+(k+1)+'</label><input type="number" id="pn'+k+'" min="1" value="'+v+'" inputmode="numeric"></div>'}).join("")+'<div class="err" id="pferr"></div><div class="acts" style="margin-top:10px"><button data-a="plantSave">Add '+(pf.qty===1?'plant':'plants')+'</button><button class="ghost" data-a="plantBack">Back</button><button class="ghost" data-a="closeSet">Cancel</button></div>'}
    m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Add plants"><div class="row" style="justify-content:space-between;align-items:center"><strong style="font-size:1.1rem">'+(pf.step===1?'Add plants':'Assign plant numbers')+'</strong><button class="ghost" data-a="closeSet" aria-label="Close">✕</button></div>'+b2+'</div>';return}
  if(bloomFor){m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Add bloom"><div class="row" style="justify-content:space-between;align-items:center"><strong style="font-size:1.1rem">Add bloom</strong><button class="ghost" data-a="closeSet" aria-label="Close">✕</button></div><div class="meta" style="margin:6px 0 8px">Plant #'+esc(bp.num)+(bp.note?' · '+esc(bp.note):'')+'</div><div class="row"><label>Number of flowers<input type="number" id="bq" min="1" value="1" inputmode="numeric"></label><label>Bloom date<input type="date" id="bd" value="'+iso(new Date())+'"></label></div><div class="err" id="berr"></div><div class="acts" style="margin-top:10px"><button data-a="saveBloom">Add bloom</button><button class="ghost" data-a="closeSet">Cancel</button></div></div>';return}
  if(!infoOpen){m.innerHTML="";return}
  var rows=TYPES.map(function(t,k){return '<div class="trow"><label for="td'+k+'" style="flex-direction:row;color:var(--ink);font-size:1rem">'+esc(t)+'</label><input type="number" id="td'+k+'" min="1" max="120" inputmode="numeric" value="'+daysFor({note:t})+'"></div>'}).join("");
  m.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Settings"><div class="row" style="justify-content:space-between;align-items:center"><strong style="font-size:1.1rem">Settings</strong><button class="ghost" data-a="closeSet" aria-label="Close">✕</button></div><div class="meta" style="margin:6px 0 4px">Days from flower to fruit</div>'+rows+'<div class="meta" style="margin-top:6px">Typically about 30 to 50 days, depending on weather.</div><div class="acts" style="margin-top:10px"><button class="ok" data-a="saveTD">Save</button><button class="ghost" data-a="closeSet">Cancel</button></div></div>';
}
function suggest(n){var used={},out=[],k=1;S.plants.forEach(function(x){used[x.num]=1});while(out.length<n){if(!used[k])out.push(k);k++}return out}
function daysFor(p){var m=S.typeDays||{},v=p&&m[p.note];return v>0?v:S.days}
function info(b,p){
  var d=daysFor(p),bloom=parse(b.date),ready=new Date(bloom);ready.setDate(ready.getDate()+d);
  var left=Math.round((ready-today())/864e5);
  var done=Math.min(100,Math.max(0,Math.round((d-left)/d*100)));
  return {ready:ready,left:left,pct:done,days:d};
}
function label(left){
  if(left>1)return left+" days left";
  if(left===1)return "1 day left";
  if(left===0)return "Ready today";
  return "Ready, "+(-left)+(left===-1?" day":" days")+" past";
}
function cls(left){return left>0?"":(left===0?"ready":"late")}
function renderTotals(){
  var on=!loading;$("acct").hidden=loading;$("loading").hidden=!loading;document.querySelector(".tabs").style.display=on?"flex":"none";$("v-planner").hidden=!on||tab!=="planner";$("v-totals").hidden=!on||tab!=="totals";
var sb=$("selbar"),showSel=selMode&&on&&tab==="planner";sb.hidden=!showSel;$("listbar").style.display=selMode?"none":"flex";$("pcount").textContent="Plants ("+S.plants.length+")";$("fab").hidden=!(on&&tab==="planner"&&!selMode);$("v-planner").style.paddingBottom=showSel?"90px":"";
if(showSel){var cnt=Object.keys(sel).filter(function(i){return find(i)}).length;sb.innerHTML='<div><strong>'+cnt+' selected</strong></div><div class="acts" style="margin:0"><button class="ghost" data-a="selAll">'+(cnt===S.plants.length?'Select none':'Select all')+'</button><button class="danger" data-a="selDelete"'+(cnt?'':' disabled')+'>Delete</button><button class="ghost" data-a="selCancel">Cancel</button></div>'}
  var tb=document.querySelectorAll(".tab");for(var j=0;j<tb.length;j++)tb[j].classList.toggle("on",tb[j].dataset.t===tab);
  var order=TYPES.slice(),m={};
  order.forEach(function(t){m[t]={plants:0,fl:0}});
  S.plants.forEach(function(p){var k=p.note||"No type";if(!m[k])m[k]={plants:0,fl:0};m[k].plants++;m[k].fl+=p.batches.reduce(function(s,b){return s+b.qty},0)});
  var keys=order.concat(Object.keys(m).filter(function(k){return order.indexOf(k)<0}));
  var tp=0,tf=0;
  var rows=keys.map(function(k){var v=m[k];tp+=v.plants;tf+=v.fl;return '<div class="trow"><div><strong>'+esc(k)+'</strong><div class="meta">'+v.plants+(v.plants===1?' plant':' plants')+'</div></div><b>'+v.fl+(v.fl===1?' flower':' flowers')+'</b></div>'}).join("");
  $("totals").innerHTML=rows+'<div class="trow"><div><strong>All plants</strong><div class="meta">'+tp+(tp===1?' plant':' plants')+'</div></div><b>'+tf+(tf===1?' flower':' flowers')+'</b></div>';
}
function render(){renderTotals();
  
  var all=[];
  S.plants.forEach(function(p){p.batches.forEach(function(b){var i=info(b,p);all.push({p:p,b:b,i:i})})});
  all.sort(function(a,b){return a.i.left-b.i.left});
  var n=$("next");
  var head='<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px"><strong>Next harvest</strong><button class="ghost" data-a="settings">Settings</button></div>';
  var body;
  if(!all.length){body='<div class="meta">Add a plant and a flower batch to start the countdown.</div>'}
  else{var x=all[0];body='<div>Plant #'+esc(x.p.num)+': '+x.b.qty+(x.b.qty===1?' flower':' flowers')+' · <b>'+label(x.i.left)+'</b></div><div class="meta">Around '+fmt(x.i.ready)+'</div>'}
  n.innerHTML=head+body;
  var list=S.plants.slice().sort(function(a,b){return a.num-b.num});
  if(!list.length){$("plants").innerHTML='<div class="empty">No plants yet. Tap + to add your first plant.</div>';return}
  $("plants").innerHTML=list.map(function(p){
    var tot=p.batches.reduce(function(s,b){return s+b.qty},0);
    var bs=p.batches.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(b){
      var i=info(b,p),c=cls(i.left),dis=editingP===p.id?'':' disabled';if(editing===b.id){return '<div class="batch"><div class="row"><label>Flowers<input type="number" min="1" id="eq" value="'+b.qty+'" inputmode="numeric"></label><label>Bloom date<input type="date" id="ed" value="'+b.date+'"></label></div><div class="acts"><button class="ok" data-a="saveEdit" data-p="'+p.id+'" data-b="'+b.id+'">Save</button><button class="ghost" data-a="cancelEdit">Cancel</button></div></div>'}
      return '<div class="batch"><div class="top"><strong>'+b.qty+(b.qty===1?' flower':' flowers')+'</strong><span class="pill '+c+'">'+label(i.left)+'</span></div>'
      +'<div class="bar"><i class="'+(i.left<=0?'ready':'')+'" style="width:'+i.pct+'%"></i></div>'
      +'<div class="meta">Bloomed '+fmt(parse(b.date))+' · fruit around '+fmt(i.ready)+'</div>'
      +'<div class="acts"><button class="ghost" data-a="editBatch" data-p="'+p.id+'" data-b="'+b.id+'"'+dis+'>Edit</button><button class="ghost" data-a="delBatch" data-p="'+p.id+'" data-b="'+b.id+'"'+dis+'>Remove</button><button class="ok" data-a="harvest" data-p="'+p.id+'" data-b="'+b.id+'">Harvested</button></div></div>';
    }).join("");
    var head;if(editingP===p.id){var tl=TYPES.slice();if(p.note&&tl.indexOf(p.note)<0)tl.push(p.note);head='<div class="head"><div class="row"><label>Plant number<input type="number" min="1" id="epn" value="'+p.num+'" inputmode="numeric"></label><label>Plant type<select id="ept"><option value="">Select type</option>'+tl.map(function(t){return '<option'+(t===p.note?' selected':'')+'>'+esc(t)+'</option>'}).join("")+'</select></label></div><div class="acts" style="margin:0"><button class="ok" data-a="savePlant" data-p="'+p.id+'">Save</button><button class="ghost" data-a="cancelPlant">Cancel</button></div></div><div class="err" id="eperr"></div>'}else{head='<div class="head"><div><h2>Plant #'+esc(p.num)+'</h2><div class="tot">'+esc(p.note||'')+'</div></div><div class="acts" style="margin:0"><button class="ghost" data-a="toggle" data-p="'+p.id+'">Hide</button><button class="ghost" data-a="editPlant" data-p="'+p.id+'">Edit</button><button class="ghost" data-a="delPlant" data-p="'+p.id+'">Delete plant</button></div></div>'}var nb=null;p.batches.forEach(function(b){var i2=info(b,p);if(!nb||i2.left<nb.i.left)nb={b:b,i:i2}});
    var sum=nb?'<span class="pill '+cls(nb.i.left)+'">'+label(nb.i.left)+'</span>':'<span class="meta">No blooms yet</span>';var sum2=nb?'<div class="tot" style="margin-top:3px">'+nb.b.qty+(nb.b.qty===1?' flower':' flowers')+' · '+fmt(nb.i.ready)+'</div>':'';
    if((selMode||!open[p.id])&&editingP!==p.id)return '<div class="card plant'+(sel[p.id]?' sel':'')+'" data-pid="'+p.id+'" data-a="toggle" data-p="'+p.id+'" style="cursor:pointer"><div class="head" style="margin:0"><div><h2>Plant #'+esc(p.num)+'</h2><div class="tot" style="margin-top:2px">'+(p.note?esc(p.note)+' · ':'')+sum+'</div>'+sum2+'</div>'+(selMode?'<span class="chk'+(sel[p.id]?' on':'')+'">'+(sel[p.id]?'✓':'')+'</span>':'<button class="ghost" data-a="toggle" data-p="'+p.id+'">Show</button>')+'</div></div>';return '<div class="card plant" data-pid="'+p.id+'">'+head
    +bs+'<div class="meta" style="margin-top:10px">New flowers opened on a different day? Log them as another bloom.</div><div class="acts"><button data-a="openBloom" data-p="'+p.id+'">Add bloom</button></div></div>';
  }).join("");
}
function find(id){return S.plants.filter(function(p){return p.id===id})[0]}
document.addEventListener("click",function(e){
if(held)return;
if(selMode){var cc=e.target.closest(".plant");if(cc&&cc.dataset.pid){var pid=cc.dataset.pid;if(sel[pid])delete sel[pid];else sel[pid]=1;render();return}}
var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a,p=t.dataset.p?find(t.dataset.p):null;
  if((a==="editBatch"||a==="delBatch")&&!(p&&editingP===p.id))return;
  if(a==="signin"||a==="signup"){doAuth(a);return}
  if(a==="mode"){authMode=t.dataset.m;msg="";renderAcct();return}
  if(a==="settings"){infoOpen=true;bloomFor=null;plantFlow=null;renderModal();var f0=$("td0");if(f0&&f0.focus)f0.focus();return}
  if(a==="closeSet"){if(t.id==="modal"&&e.target!==t)return;infoOpen=false;bloomFor=null;plantFlow=null;delList=null;renderModal();return}
  if(a==="delConfirm"&&delList){var ids=delList;S.plants=S.plants.filter(function(x){return ids.indexOf(x.id)<0});ids.forEach(function(i){delete open[i]});delList=null;selMode=false;sel={};renderModal();save();render();return}
  if(a==="selStart"){selMode=true;sel={};editing=null;editingP=null;infoOpen=false;render();return}
  if(a==="selCancel"){selMode=false;sel={};render();return}
  if(a==="selAll"){var allIds=S.plants.map(function(x){return x.id});var every=allIds.length>0&&allIds.every(function(i){return sel[i]});sel={};if(!every)allIds.forEach(function(i){sel[i]=1});render();return}
  if(a==="selDelete"){var ids2=Object.keys(sel).filter(function(i){return find(i)});if(!ids2.length)return;delList=ids2;renderModal();return}
  if(a==="openPlants"){plantFlow={step:1,type:"",qty:1};infoOpen=false;bloomFor=null;renderModal();var fp=$("pt");if(fp&&fp.focus)fp.focus();return}
  if(a==="plantNext"&&plantFlow){var ty=$("pt").value,qn=parseInt($("pq").value,10);if(!ty){$("pferr").textContent="Choose a plant type.";return}if(!qn||qn<1||qn>50){$("pferr").textContent="Enter how many plants, from 1 to 50.";return}plantFlow={step:2,type:ty,qty:qn,nums:suggest(qn)};renderModal();return}
  if(a==="plantBack"&&plantFlow){plantFlow={step:1,type:plantFlow.type,qty:plantFlow.qty};renderModal();return}
  if(a==="plantSave"&&plantFlow){var nums=[],ok=true;for(var k=0;k<plantFlow.qty;k++){var v=parseInt($("pn"+k).value,10);if(!v||v<1)ok=false;nums.push(v)}
    if(!ok){$("pferr").textContent="Enter a number for every plant.";return}
    var bad=null;nums.forEach(function(v,i){if(bad)return;if(nums.indexOf(v)!==i)bad="Plant numbers must be different. #"+v+" is used twice.";else if(S.plants.some(function(x){return x.num===v}))bad="Plant #"+v+" already exists."});
    if(bad){$("pferr").textContent=bad;return}
    var tp2=plantFlow.type;nums.forEach(function(v){var np2={id:uid(),num:v,note:tp2,batches:[]};S.plants.push(np2);open[np2.id]=nums.length===1});
    plantFlow=null;renderModal();save();render();return}
  if(a==="openBloom"&&p){bloomFor=p.id;infoOpen=false;plantFlow=null;renderModal();var fq=$("bq");if(fq&&fq.focus)fq.focus();return}
  if(a==="saveBloom"){var bp=find(bloomFor),q=parseInt($("bq").value,10),dt=$("bd").value;if(!bp)return;if(!q||q<1||q>999||!dt){$("berr").textContent="Enter the number of flowers and a bloom date.";return}bp.batches.push({id:uid(),qty:q,date:dt});open[bp.id]=true;bloomFor=null;renderModal();save();render();return}
  if(a==="saveTD"){var m={};TYPES.forEach(function(ty,k){var v=parseInt($("td"+k).value,10);if(v>0&&v<=120)m[ty]=v});S.typeDays=m;infoOpen=false;renderModal();save();render();return}
  if(a==="signout"){signOut();return}
  if(a==="tab"){tab=t.dataset.t;renderTotals();return}
  if(a==="toggle"&&p){open[p.id]=!open[p.id];}else if(a==="editPlant"){editingP=t.dataset.p;render();return;}else if(a==="cancelPlant"){editingP=null;render();return;}else if(a==="savePlant"&&p){var n2=parseInt($("epn").value,10);if(!n2||n2<1){$("eperr").textContent="Enter a plant number.";return}if(S.plants.some(function(x){return x!==p&&x.num===n2})){$("eperr").textContent="Plant #"+n2+" already exists.";return}if(!$("ept").value){$("eperr").textContent="Choose a plant type.";return}p.num=n2;p.note=$("ept").value;editingP=null;}else if(a==="editBatch"){editing=t.dataset.b;render();return;}else if(a==="cancelEdit"){editing=null;render();return;}else if(a==="saveEdit"&&p){var q2=parseInt($("eq").value,10),d2=$("ed").value;if(!q2||q2<1||!d2)return;var bb=p.batches.filter(function(b){return b.id===t.dataset.b})[0];if(bb){bb.qty=q2;bb.date=d2}editing=null;}else if((a==="harvest"||a==="delBatch")&&p){
    p.batches=p.batches.filter(function(b){return b.id!==t.dataset.b});
  }else if(a==="delPlant"&&p){
    if(!confirm("Delete plant #"+p.num+" and its flowers?"))return;
    S.plants=S.plants.filter(function(x){return x!==p});
  }
  save();render();
});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(infoOpen||bloomFor||plantFlow||delList){infoOpen=false;bloomFor=null;plantFlow=null;delList=null;renderModal()}else if(selMode){selMode=false;sel={};render()}});
var held=false,lpT=null,lpX=0,lpY=0,pl=$("plants");
function startDel(id){if(selMode)return;selMode=true;sel={};sel[id]=1;editing=null;editingP=null;infoOpen=false;bloomFor=null;plantFlow=null;held=true;render()}
function lpCancel(){clearTimeout(lpT);lpT=null}
pl.addEventListener("pointerdown",function(e){
  if(e.button>0||selMode)return;
  if(e.target.closest("button,input,select,label"))return;
  var c=e.target.closest(".plant");if(!c||!c.dataset.pid)return;
  lpX=e.clientX;lpY=e.clientY;lpCancel();
  lpT=setTimeout(function(){lpT=null;startDel(c.dataset.pid)},600);
});
pl.addEventListener("pointermove",function(e){if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))lpCancel()});
["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,function(){lpCancel();if(held)setTimeout(function(){held=false},350)})});
pl.addEventListener("contextmenu",function(e){var c=e.target.closest(".plant");if(!c||!c.dataset.pid||e.target.closest("input,select"))return;e.preventDefault();lpCancel();startDel(c.dataset.pid)});
render();renderAcct();if(sess)withLoad(function(){return pull(false)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sess&&!timer)pull(false)});
})();
</script>
</body>
