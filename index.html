.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:90px}
input[type=text],input[type=password]{width:170px}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--pink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 9px;font-size:.8rem}
button.ok{background:var(--green);color:#fff;padding:5px 9px;font-size:.8rem}
.plant h2{margin:0;font-size:1.15rem;color:var(--green)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tot{color:var(--muted);font-size:.85rem}
.batch{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-size:.8rem;border-radius:99px;padding:2px 10px;background:var(--pinkbg);color:var(--pink);white-space:nowrap}
.pill.ready{background:var(--greenbg);color:var(--green)}
.pill.late{background:var(--amberbg);color:var(--amber)}
.bar{height:6px;border-radius:4px;background:var(--line);margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink)}
.bar i.ready{background:var(--green)}
.meta{font-size:.8rem;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:6px}
.next{background:var(--pinkbg);border-color:transparent}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line)}.tab.on{background:var(--pink);color:#fff;border-color:var(--pink)}.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border:0}.trow b{color:var(--green)}.th{margin:0 0 4px;font-size:1.1rem;color:var(--green)}
.info{border-radius:50%;width:28px;height:28px;padding:0;font-weight:700;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.ov[hidden]{display:none}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.plant{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.plant input,.plant select{-webkit-user-select:text;user-select:text}.danger{background:#b3261e}
.plant.sel{outline:2px solid var(--pink);background:var(--pinkbg)}.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;flex:none}.chk.on{background:var(--pink);border-color:var(--pink)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.selbar[hidden]{display:none}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pink);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}button:disabled{opacity:.6;cursor:default}
.empty{color:var(--muted);text-align:center;padding:24px}
.err{color:var(--amber);font-size:.85rem;margin-top:6px;min-height:1em}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<header class="hd"><div><h1>Dragon Fruit Planner</h1>
<p class="sub">Track each plant’s flowers and count down to harvest.</p></div><div class="logo" role="img" aria-label="Dragon fruit icon"></div></header>

<div class="card" id="acct"></div>
<div class="card" id="loading" hidden style="text-align:center;padding:36px"><div class="spin"></div><div>Loading your planner…</div></div>
<div class="tabs"><button class="tab on" data-a="tab" data-t="planner">Planner</button><button class="tab" data-a="tab" data-t="totals">Totals</button></div>
<div id="v-planner"><div class="card next" id="next"></div>

<div class="row" id="listbar" style="justify-content:space-between;align-items:center;margin:4px 2px 10px"><strong id="pcount">Plants</strong><div style="display:flex;gap:6px;align-items:center"><button data-a="openPlants" style="padding:6px 12px;font-size:.85rem">+ Add plant</button><button class="ghost" data-a="selStart">Select</button></div></div>

<div id="plants"></div></div>
<div id="v-totals" hidden><div class="card"><h2 class="th">Flowers by plant type</h2><div class="meta">Counts flowers still growing. Harvested batches are not included.</div><div id="totals"></div></div></div>
</main>
<div class="ov" id="modal" data-a="closeSet" hidden></div>
<div class="selbar" id="selbar" hidden></div>

  if(a==="saveBloom"){var bp=find(bloomFor),q=parseInt($("bq").value,10),dt=$("bd").value;if(!bp)return;if(!q||q<1||q>999||!dt){$("berr").textContent="Enter the number of flowers and a bloom date.";return}bp.batches.push({id:uid(),qty:q,date:dt});open[bp.id]=true;bloomFor=null;renderModal();save();render();return}
  if(a==="saveTD"){var m={};TYPES.forEach(function(ty,k){var v=parseInt($("td"+k).value,10);if(v>0&&v<=120)m[ty]=v});S.typeDays=m;infoOpen=false;renderModal();save();render();return}
  if(a==="signout"){signOut();return}
  if(a==="tab"){tab=t.dataset.t;renderTotals();return}
  if(a==="toggle"&&p){open[p.id]=!open[p.id];}else if(a==="editPlant"){editingP=t.dataset.p;render();return;}else if(a==="cancelPlant"){editingP=null;render();return;}else if(a==="savePlant"&&p){var n2=parseInt($("epn").value,10);if(!n2||n2<1){$("eperr").textContent="Enter a plant number.";return}if(S.plants.some(function(x){return x!==p&&x.num===n2})){$("eperr").textContent="Plant #"+n2+" already exists.";return}if(!$("ept").value){$("eperr").textContent="Choose a plant type.";return}p.num=n2;p.note=$("ept").value;editingP=null;}else if(a==="editBatch"){editing=t.dataset.b;render();return;}else if(a==="cancelEdit"){editing=null;render();return;}else if(a==="saveEdit"&&p){var q2=parseInt($("eq").value,10),d2=$("ed").value;if(!q2||q2<1||!d2)return;var bb=p.batches.filter(function(b){return b.id===t.dataset.b})[0];if(bb){bb.qty=q2;bb.date=d2}editing=null;}else if((a==="harvest"||a==="delBatch")&&p){
    p.batches=p.batches.filter(function(b){return b.id!==t.dataset.b});
  }else if(a==="delPlant"&&p){
    if(!confirm("Delete plant #"+p.num+" and its flowers?"))return;
    S.plants=S.plants.filter(function(x){return x!==p});
  }
  save();render();
});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(infoOpen||bloomFor||plantFlow||delList){infoOpen=false;bloomFor=null;plantFlow=null;delList=null;renderModal()}else if(selMode){selMode=false;sel={};render()}});
var held=false,lpT=null,lpX=0,lpY=0,pl=$("plants");
function startDel(id){if(selMode)return;selMode=true;sel={};sel[id]=1;editing=null;editingP=null;infoOpen=false;bloomFor=null;plantFlow=null;held=true;render()}
function lpCancel(){clearTimeout(lpT);lpT=null}
pl.addEventListener("pointerdown",function(e){
  if(e.button>0||selMode)return;
  if(e.target.closest("button,input,select,label"))return;
  var c=e.target.closest(".plant");if(!c||!c.dataset.pid)return;
  lpX=e.clientX;lpY=e.clientY;lpCancel();
  lpT=setTimeout(function(){lpT=null;startDel(c.dataset.pid)},600);
});
pl.addEventListener("pointermove",function(e){if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))lpCancel()});
["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,function(){lpCancel();if(held)setTimeout(function(){held=false},350)})});
pl.addEventListener("contextmenu",function(e){var c=e.target.closest(".plant");if(!c||!c.dataset.pid||e.target.closest("input,select"))return;e.preventDefault();lpCancel();startDel(c.dataset.pid)});
function sizeLogo(){var l=document.querySelector(".logo");if(!l)return;for(var k=0;k<6;k++){var hh=l.offsetHeight;if(!hh)break;var w=Math.min(hh,80);if(Math.abs(l.offsetWidth-w)<1)break;l.style.width=w+"px"}}
if(typeof window!=="undefined")window.addEventListener("resize",sizeLogo);
render();renderAcct();if(sess)withLoad(function(){return pull(false)});
sizeLogo();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sess&&!timer)pull(false)});
})();
</script>
